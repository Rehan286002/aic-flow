
[project]
name = "aic-flow-backend"
version = "0.1.0"
description = "AIC-Flow AICTE approval workflow and compliance platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "celery>=5.6.3",
    "fastapi>=0.162.0",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.3",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rapidocr>=3.10.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
